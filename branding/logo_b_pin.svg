    <path id="pin" d="M256 486 C 256 486, 92 318, 92 206 C 92 114, 166 46, 256 46 C 346 46, 420 114, 420 206 C 420 318, 256 486, 256 486 Z" fill="#D7263D" stroke="#3A2A21" stroke-width="10" stroke-linejoin="round"/>
